# Production stack — baked image, no code bind-mount, no Kamal.
#
#   cp backend/.env.prod.example backend/.env.prod
#   # fill secrets, then:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# API: host port 3000. Postgres/Redis stay on the compose network (not published).

name: scotive-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scotive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scotive}
      POSTGRES_DB: scotive
    volumes:
      - scotive_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scotive -d scotive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - scotive_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.prod
    environment:
      RAILS_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://scotive:${POSTGRES_PASSWORD:-scotive}@db:5432/scotive
      REDIS_URL: redis://redis:6379/0
      RUN_DB_PREPARE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://scotive:${POSTGRES_PASSWORD:-scotive}@db:5432/scotive
      REDIS_URL: redis://redis:6379/0
      RUN_DB_PREPARE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  scotive_pg_prod:
  scotive_redis_prod:
