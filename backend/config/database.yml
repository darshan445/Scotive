# PostgreSQL — always from .env (DATABASE_URL). No per-env passwords in this file.
default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV.fetch("DATABASE_URL") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") { ENV.fetch("DATABASE_URL") } %>

production:
  <<: *default
