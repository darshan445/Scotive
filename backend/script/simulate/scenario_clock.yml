# ==============================================================================
# Token-only HOME, outbound-only clock, FindInvoiceThread fallback
#
# Do NOT run this in the same pass as scenario.yml. That file's unlabeled
# "Payment released" joint-links every open invoice and would add inbound to
# these rows, so clock + fallback would never fire.
#
# Expect after onboarding:
#   SIM-2201 — HOME = the pay-link send (no invoice # in subject/body). Clock
#              overdue. No client mail. No EvaluateInvoiceState.
#   SIM-2202 — never emailed. Batch miss → FindInvoiceThread (from:me + number,
#              then client cluster). Still unmatched. Clock overdue.
# ==============================================================================
user_email: testuser@gmail.com
user_mailbox: wherewasthis.contact@gmail.com
client_email: rp9900821@gmail.com
client_name: AR Sim rp9900821
company_name: "Craig's Design and Landscaping Services"
unique_subjects: true
wait_seconds: 8
send_from_qbo: true

invoices:
  # Pay-link token HOME. Subject and body must not say SIM-2201. QBO InvoiceLink
  # last path segment is the token. Amount omitted so unique-$ cannot bind.
  - number: SIM-2201
    amount: 205.00
    due_in_days: -4
    description: Token-only dispatch
    send:
      via: plain
      from: wherewasthis.contact@gmail.com
      subject: "Your invoice is ready"
      message: "Pay here: {{pay_link}}"

  # Created in QBO, never sent. Fallback search should run and miss.
  - number: SIM-2202
    amount: 215.00
    due_in_days: -2
    description: Never emailed
    send:
      via: none
