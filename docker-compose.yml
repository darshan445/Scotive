# Rails 8 API + Postgres + Redis + Sidekiq (development)
#
#   docker compose up --build
#
# Production: docker-compose.prod.yml + backend/.env.prod
#   docker compose -f docker-compose.prod.yml up --build -d
#
# API: http://localhost:3000/api/health

name: scotive-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scotive
      POSTGRES_PASSWORD: scotive
      POSTGRES_DB: scotive
    ports:
      - "5432:5432"
    volumes:
      - scotive_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scotive -d scotive"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://scotive:scotive@db:5432/scotive
      TEST_DATABASE_URL: postgres://scotive:scotive@db:5432/scotive_test
      REDIS_URL: redis://redis:6379/0
      RUN_DB_PREPARE: "false"
    volumes:
      - ./backend:/app
      - scotive_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://scotive:scotive@db:5432/scotive
      REDIS_URL: redis://redis:6379/0
      RUN_DB_PREPARE: "false"
    volumes:
      - ./backend:/app
      - scotive_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  scotive_pg_dev:
  scotive_bundle:
