# Development stack — hot-reload API + MongoDB
#
#   cp backend/.env.example backend/.env   # fill secrets
#   docker compose up --build
#
# API: http://localhost:8000   health: /api/health
# Compose overrides MONGO_URL to the mongo service (ignore localhost in .env).

name: scotive-dev

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - scotive_mongo_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        PYTHON_VERSION: "3.11"
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-scotive}
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  scotive_mongo_dev:
